[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "awesome-harness-123"
version = "0.1.0"
description = "A local-first, runtime-portable development-agent harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aaron Rassiq" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
harness = "awesome_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["awesome_harness"]
